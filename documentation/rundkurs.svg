="#172033" font-size="15" textLength="188.716" font-family="Segoe UI">x(t) = Breite · r(t) · cos(t)</text><text x="224.55" y="254.334" fill="#172033" font-size="15" textLength="179.194" font-family="Segoe UI">y(t) = Höhe · r(t) · sin(t)</text></g><!--entity points--><g class="entity" data-qualified-name="points" id="ent0003" data-source-line="18"><rect x="483.27" y="169.297" width="198.381" height="89.844" fill="#F1EAFE" style="stroke:#CBD5E1;stroke-width:0.5;" rx="9" ry="9"/><text x="493.27" y="193.22" fill="#172033" font-size="15" textLength="96.204" font-weight="700" font-family="Segoe UI">360 Punkte</text><text x="493.27" y="210.681" fill="#172033" font-size="15" font-family="Segoe UI"> </text><text x="493.27" y="228.142" fill="#172033" font-size="15" textLength="178.381" font-family="Segoe UI">Zu einer geschlossenen</text><text x="493.27" y="245.603" fill="#172033" font-size="15" textLength="121.26" font-family="Segoe UI">Linie verbunden</text></g><!--entity draw--><g class="entity" data-qualified-name="draw" id="ent0004" data-source-line="20"><rect x="755.92" y="44.297" width="142.754" height="89.844" fill="#E8F7F1" style="stroke:#CBD5E1;stroke-width:0.5;" rx="9" ry="9"/><text x="765.92" y="68.22" fill="#172033" font-size="15" textLength="67.244" font-weight="700" font-family="Segoe UI">Anzeige</text><text x="765.92" y="85.681" fill="#172033" font-size="15" font-family="Segoe UI"> </text><text x="765.92" y="103.142" fill="#172033" font-size="15" textLength="122.754" font-family="Segoe UI">Kurs im Browser</text><text x="765.92" y="120.603" fill="#172033" font-size="15" textLength="67.266" font-family="Segoe UI">zeichnen</text></g><!--entity distance--><g class="entity" data-qualified-name="distance" id="ent0005" data-source-line="21"><rect x="746.54" y="169.297" width="161.511" height="89.844" fill="#E8F7F1" style="stroke:#CBD5E1;stroke-width:0.5;" rx="9" ry="9"/><text x="756.54" y="193.22" fill="#172033" font-size="15" textLength="69.983" font-weight="700" fon